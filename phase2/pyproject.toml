[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airsign-ebim-phase2"
version = "0.2.0"
description = "AirSign EBiM Phase II policies and real demonstration training"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.8", "torchvision>=0.23", "pyarrow>=18", "av>=14", "pillow>=10", "requests>=2.32", "scipy>=1.13"]

[project.optional-dependencies]
sim = ["mujoco==3.3.7"]
test = ["pytest>=8"]
vision = ["transformers==5.12.0", "safetensors>=0.6", "opencv-python-headless>=4.10"]

[project.scripts]
ebim-download = "ebim_phase2.download:main"
ebim-prepare = "ebim_phase2.data:main"
ebim-train = "ebim_phase2.train:main"
ebim-policy = "ebim_phase2.runtime:main"

[tool.setuptools.packages.find]
include = ["ebim_phase2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
