name: Judge readiness

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CPU-only submission checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report runtime
        run: python3 --version

      - name: Validate judge contract
        run: python3 scripts/validate_submission.py
